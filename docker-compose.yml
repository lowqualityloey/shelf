version: '3.8'

services:
  db:
    image: postgres:16.9-bookworm
    container_name: shelf_db
    restart: always
    env_file:
      - ./server/.env
    environment:
      POSTGRES_USER: ${DB_USER:-shelf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shelf_pass}
      POSTGRES_DB: ${DB_NAME:-shelf_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: